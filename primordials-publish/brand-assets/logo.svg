<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F3D3E" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#0A0908" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </radialGradient>

    <!-- Bioluminescent Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="predatorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Prey Organism Gradient -->
    <radialGradient id="preyGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#78FFD6"/>
      <stop offset="50%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#0F3D3E"/>
    </radialGradient>

    <!-- Predator Shard Gradient -->
    <linearGradient id="predatorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7597"/>
      <stop offset="60%" stop-color="#FF4FA3"/>
      <stop offset="100%" stop-color="#800040"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)"/>

  <!-- Orbital Ring (Lotka-Volterra Cycle) -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#4ECDC4" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="6 8"/>
  <ellipse cx="256" cy="256" rx="170" ry="110" transform="rotate(-25 256 256)" fill="none" stroke="#FF4FA3" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Micro Nutrient Particles -->
  <circle cx="160" cy="180" r="3.5" fill="#4ECDC4" opacity="0.6" filter="url(#glow)"/>
  <circle cx="340" cy="310" r="2.5" fill="#78FFD6" opacity="0.5"/>
  <circle cx="310" cy="160" r="4" fill="#F4F1DE" opacity="0.4"/>
  <circle cx="190" cy="330" r="3" fill="#FF4FA3" opacity="0.5"/>
  <circle cx="140" cy="280" r="2" fill="#4ECDC4" opacity="0.7"/>

  <!-- Primary Prey Nucleus (Cellular Organism) -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="48" fill="url(#preyGrad)"/>
    <circle cx="256" cy="256" r="54" fill="none" stroke="#78FFD6" stroke-width="2" opacity="0.7"/>
    <!-- Inner Genetic Core -->
    <polygon points="256,232 274,250 256,268 238,250" fill="#F4F1DE" opacity="0.85"/>
    <circle cx="256" cy="256" r="7" fill="#0F3D3E"/>
  </g>

  <!-- Orbiting Apex Predator (Sharp Geometric Shard) -->
  <g transform="translate(360, 180) rotate(40)" filter="url(#predatorGlow)">
    <polygon points="0,-32 18,24 -18,24" fill="url(#predatorGrad)"/>
    <polygon points="0,-24 10,18 -10,18" fill="#FF7597" opacity="0.6"/>
  </g>

  <!-- Subtle Velocity Vectors -->
  <path d="M 375 195 Q 395 230 380 270" fill="none" stroke="#FF4FA3" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M 140 230 Q 150 256 175 270" fill="none" stroke="#4ECDC4" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
</svg>
