# ─────────────────────────────────────────────
# Primordials — CI/CD Pipeline
# ─────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  CACHE_VERSION: v2

jobs:
  # ─── C++ Engine Tests ───────────────────────
  engine-linux:
    name: "C++ Engine — Ubuntu"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++-13 \
            libasound2-dev libpulse-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev \
            libxxf86vm-dev libwayland-dev libxkbcommon-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -G Ninja -S . -B build/test -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DSHAPE_BUILD_TESTS=ON -DSHAPE_BUILD_EXAMPLES=OFF -DSHAPE_BUILD_BENCHMARKS=OFF -DSHAPE_BUILD_GAMES=OFF -DSHAPE_BUILD_LAUNCHER=OFF -DSHAPE_BUILD_TOOLS=OFF -DCMAKE_CXX_COMPILER=g++-13
      - name: Build
        run: cmake --build build/test --config ${{ env.BUILD_TYPE }} --target ShapeEngineTests --parallel 2
      - name: Test
        run: ctest --test-dir build/test --output-on-failure --verbose

  engine-macos:
    name: "C++ Engine — macOS"
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install macOS dependencies
        run: |
          brew update
          brew install cmake ninja sdl3 sdl3_image sdl3_ttf sdl3_mixer || brew install cmake ninja
      - name: Diagnose dependencies
        run: |
          cmake --version
          clang++ --version
          brew --prefix
          brew list --versions cmake ninja sdl3 sdl3_image sdl3_ttf sdl3_mixer || true
      - name: Configure
        run: |
          cmake -G Ninja \
            -S . \
            -B build/test \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DSHAPE_BUILD_TESTS=ON \
            -DSHAPE_BUILD_EXAMPLES=OFF \
            -DSHAPE_BUILD_BENCHMARKS=OFF \
            -DSHAPE_BUILD_GAMES=OFF \
            -DSHAPE_BUILD_LAUNCHER=OFF \
            -DSHAPE_BUILD_TOOLS=OFF \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)"
      - name: Build
        run: |
          set -o pipefail
          cmake --build build/test \
            --config ${{ env.BUILD_TYPE }} \
            --target ShapeEngineTests \
            --verbose 2>&1 | tee build.log || {
            echo "### macOS Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
      - name: Upload macOS build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-log
          path: build.log
      - name: Test
        run: |
          ctest \
            --test-dir build/test \
            --output-on-failure \
            --verbose

  engine-windows:
    name: "C++ Engine — Windows"
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Diagnose toolchain
        shell: pwsh
        run: |
          cmake --version
          cl
          where.exe cmake
          where.exe cl
      - name: Configure
        run: cmake -G "Visual Studio 17 2022" -A x64 -S . -B build/test -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DSHAPE_BUILD_TESTS=ON -DSHAPE_BUILD_EXAMPLES=OFF -DSHAPE_BUILD_BENCHMARKS=OFF -DSHAPE_BUILD_GAMES=OFF -DSHAPE_BUILD_LAUNCHER=OFF -DSHAPE_BUILD_TOOLS=OFF
      - name: Build
        shell: pwsh
        run: |
          try {
            cmake --build build/test --config ${{ env.BUILD_TYPE }} --target ShapeEngineTests --verbose 2>&1 | Tee-Object -FilePath build.log
            if ($LASTEXITCODE -ne 0) { throw "Build failed with exit code $LASTEXITCODE" }
          } catch {
            "### Windows Build Failure Log" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content build.log -Tail 80 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 1
          }
      - name: Upload Windows build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build.log
      - name: Test
        run: ctest --test-dir build/test -C ${{ env.BUILD_TYPE }} --output-on-failure --verbose

  # ─── Web App ────────────────────────────────
  web:
    name: "Web App — Lint, Test, Build"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test Matrix
        run: npm run test:matrix
      - name: Build Web
        run: npm run build
      - name: Build Wallpaper
        run: npm run build:wallpaper
      - name: Package Wallpaper
        run: npm run package:wallpaper
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  # ─── Documentation ──────────────────────────
  docs:
    name: "Docs — Spell & Lint Check"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install codespell
        run: pip install codespell
      - name: Run codespell
        run: codespell --skip=".git,build,node_modules,dist,dist-*,playwright-report,test-results,benchmarks,ThirdParty,*.lock,*.json,*.png,*.jpg,*.svg" --ignore-words-list="teh,nd,wnat,outLow,anc,currentY,SIZ,nIn,LOD,IST,AllTime,ThirdParty,te,ue,ot,bu,fo,YaU,AER,trough"
