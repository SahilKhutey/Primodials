name: ShapeEngine CI Matrix

on:
  push:
    branches: [ "main", "v2.0-cleanup", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} - ${{ matrix.compiler }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Debug, Release]
        compiler: [default, clang]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Linux Dependencies & OpenGL Headers
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build clang gcc g++ libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libasound2-dev libpulse-dev

    - name: Set Compiler (Clang on Linux)
      if: runner.os == 'Linux' && matrix.compiler == 'clang'
      run: |
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build Engine & Tests
      run: |
        cmake --build build --config ${{ matrix.build_type }}

    - name: Run Catch2 Test Suite
      run: |
        if [ -f build/bin/ShapeEngineTests.exe ]; then
          ./build/bin/ShapeEngineTests.exe
        else
          ./build/bin/ShapeEngineTests
        fi
      shell: bash
